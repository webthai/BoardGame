<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knight Rescue</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#1b2340;font-family:system-ui,sans-serif}
  #c{position:fixed;inset:0;display:block}
  .hud{position:fixed;z-index:5}
  #top{top:10px;left:50%;transform:translateX(-50%);text-align:center;background:rgba(20,25,50,.85);color:#fff;border-radius:14px;padding:8px 16px;min-width:230px;max-width:92vw}
  #dice{font-size:2.2rem;font-weight:700;line-height:1}
  #side{top:10px;left:10px;width:210px}
  #cam{top:10px;right:10px}
  #msg{bottom:14px;left:50%;transform:translateX(-50%);background:rgba(20,25,50,.88);color:#fff;border-radius:12px;padding:8px 16px;max-width:90vw;text-align:center}
  #legend{bottom:10px;left:10px;background:rgba(255,255,255,.85);border-radius:10px;padding:6px 10px;font-size:.75rem}
  #setup,#win,#order,#pop,#cust{position:fixed;inset:0;z-index:10;background:rgba(10,14,35,.88);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
  #pop,#cust{z-index:11}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
  .sw{width:30px;height:30px;padding:0;border:2px solid #ccc}
  .sw.on,.btn.on{outline:3px solid #0d6efd}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="hud d-none">
  <div id="turn" class="fw-semibold"></div>
  <div id="dice">-</div>
  <div id="inv" class="d-flex flex-wrap justify-content-center gap-1 my-1"></div>
  <button id="rollBtn" class="btn btn-warning btn-sm px-4">ทอยลูกเต๋า</button>
</div>
<div id="side" class="hud d-none"><ul id="plist" class="list-group list-group-flush small"></ul></div>
<button id="cam" class="hud btn btn-light btn-sm d-none">มองทั้งกระดาน</button>
<div id="msg" class="hud d-none"></div>
<div id="legend" class="hud d-none"></div>

<div id="setup">
  <div class="card shadow" style="max-width:480px;width:100%">
    <div class="card-body">
      <h4 class="card-title mb-1">Knight Rescue</h4>
      <p class="text-muted small">มหาสงครามอัศวินช่วยเจ้าหญิง · สีเกราะ = สายอาชีพ</p>
      <div class="btn-group w-100 mb-3" id="sizes"></div>
      <div id="rows"></div>
      <div id="roleHint" class="small text-muted"></div>
      <button id="startBtn" class="btn btn-primary w-100 mt-2">เริ่มเกม</button>
    </div>
  </div>
</div>
<div id="cust" class="d-none">
  <div class="card shadow" style="max-width:460px;width:100%"><div class="card-body">
    <h5 id="custT" class="mb-2"></h5>
    <div class="d-flex gap-3">
      <canvas id="pv" width="170" height="210" style="width:170px;height:210px;background:#cfe6ff;border-radius:10px;flex:none"></canvas>
      <div id="custOpts" class="small flex-grow-1"></div>
    </div>
    <button id="custDone" class="btn btn-primary w-100 mt-3">เสร็จ</button>
  </div></div>
</div>
<div id="order" class="d-none">
  <div class="card shadow" style="max-width:380px;width:100%"><div class="card-body">
    <h5>ทอยเต๋าวัดดวง</h5><p class="text-muted small">แต้มมากเล่นก่อน</p>
    <div id="orderBox"></div><div id="orderRes" class="fw-semibold mt-2"></div>
  </div></div>
</div>
<div id="pop" class="d-none">
  <div class="card shadow" style="max-width:400px;width:100%"><div class="card-body">
    <h5 id="popT"></h5><div id="popB"></div>
  </div></div>
</div>
<div id="win" class="d-none">
  <div class="card text-center p-4" style="max-width:420px">
    <h3>ยินดีด้วย!</h3>
    <p id="winMsg"></p>
    <button class="btn btn-primary" onclick="location.reload()">กลับสู่หน้าหลัก</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== Knight Rescue — รอบที่ 5ก: ตัวปรับแต่งอัศวิน (สไตล์ Roblox) + เลือกขนาดบอร์ด 100/500/1000 =====
   หลักการ: สถานะทั้งหมดอยู่ใน S (JSON) · ทุกการกระทำผ่าน dispatch(action) · ค่าสุ่มส่งมาใน action (value, r, q, k) เพื่อซิงก์ออนไลน์ได้
   p.look = หน้าตาอัศวิน (JSON ส่งออนไลน์ได้) · ผลทอยของ Duel/Special NPC เก็บจาก popup ภายใน dispatch — รอบ 6 ต้องแยกเป็น action */
let SIZE = 100, ZONE = 80;                                  // ตั้งค่าตอนเริ่มเกม (ZONE = โซน 20% สุดท้าย)
const MAX_ITEMS = 3;
const COLORS = { 'แดง':0xd33a3a, 'น้ำเงิน':0x3a6fd3, 'เขียว':0x3fae4f, 'เหลือง':0xe6c229 };
const CN = Object.keys(COLORS);
const ROLES = { 'แดง':{n:'สายถึก',d:'HP เริ่มต้น 5'}, 'น้ำเงิน':{n:'สายม้า',d:'ตกช่องม้าวิ่งเพิ่ม +3'}, 'เขียว':{n:'สายมิตร NPC',d:'ช่อง NPC ได้ผลดีเสมอ'}, 'เหลือง':{n:'สายดวงดี',d:'ทอยได้เลขคู่ 20% ฟื้น HP 1'} };
const ITEMS = {
  IT001:{n:'โล่ศักดิ์สิทธิ์', e:'BlockDanger', d:'กันความเสียหายจากช่องอันตราย 1 ครั้ง'},
  IT002:{n:'แครอทวิเศษ',      e:'BoostWarp',   d:'ทอยครั้งถัดไปเดินเพิ่ม +3 ช่อง'},
  IT003:{n:'ยาเพิ่มพลัง',      e:'FullHeal',    d:'ฟื้น HP เต็ม'},
  IT004:{n:'เต๋าทอง',         e:'ForceSix',    d:'ทอยครั้งถัดไปได้ 6 แน่นอน'}
};
const ITEM_IDS = Object.keys(ITEMS);
const OFF = [[-.4,-.4],[.4,-.4],[-.4,.4],[.4,.4]];
const TYPES = { BlackHole:{c:0x222222,n:'หลุมดำ'}, Horse:{c:0x8b5a2b,n:'ม้า'}, NPC:{c:0x3a8fe0,n:'NPC'}, SpecialNPC:{c:0xffffff,n:'NPC พิเศษ'}, Danger:{c:0xe03a3a,n:'อันตราย'}, Treasure:{c:0xb04fd8,n:'สมบัติ'} };
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hex = c => '#' + c.toString(16).padStart(6,'0');
const d6 = () => 1 + Math.floor(Math.random() * 6);
const say = t => { $('msg').textContent = t; $('msg').classList.toggle('d-none', !t); };

/* ---------- Scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas:$('c'), antialias:true });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fc8ff);
const cam = new THREE.PerspectiveCamera(50, 1, .1, 600);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6a8a5a, .9));
const sun = new THREE.DirectionalLight(0xffffff, .6); sun.position.set(10,20,8); scene.add(sun);

function tilePos(n){ const i = Math.max(n,1)-1, r = Math.floor(i/10), c = r%2 ? 9-i%10 : i%10; return new THREE.Vector3(c*2-9, 0, r*2-9); }
let ov = { cz:0, h:26 };                                    // ตำแหน่งกล้องมุมมองทั้งกระดาน
function buildBoard(){                                      // กระเบื้อง SIZE ช่องด้วย InstancedMesh (เบา แม้ 1000 ช่อง)
  const rows = Math.ceil(SIZE / 10);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(70, rows*2 + 60), new THREE.MeshLambertMaterial({ color:0x5aa65a }));
  g.rotation.x = -Math.PI/2; g.position.set(0, -.25, rows - 10); scene.add(g);
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1.8,.4,1.8), new THREE.MeshLambertMaterial({ color:0xffffff }), SIZE);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  for (let n=1; n<=SIZE; n++){
    m.setPosition(tilePos(n)); im.setMatrixAt(n-1, m);
    im.setColorAt(n-1, c.setHex(n===SIZE ? 0xff7aa8 : n%10===0 ? 0xffc83d : n%2 ? 0xf2e7c9 : 0xd8c999));
  }
  scene.add(im);
  ov = { cz: rows - 10, h: Math.max(26, rows * 2.1) };
}

/* ---------- แผนที่เอฟเฟกต์ (สุ่มจาก seed) ---------- */
function rng(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
function genMap(seed){
  const r = rng(seed), m = {};
  for (let n=2; n<SIZE; n++){
    if (n % 10 === 0) continue;                       // ช่อง Checkpoint ว่างเสมอ
    const x = r(), ty = x<.05 ? 'BlackHole' : x<.12 ? 'Horse' : x<.20 ? 'NPC' : x<.23 ? 'SpecialNPC' : x<.35 ? 'Danger' : x<.41 ? 'Treasure' : null;
    if (ty) m[n] = { type:ty, value: ty==='Horse' ? Math.min(SIZE-1, n + 4 + Math.floor(r()*6)) : 0 };
  }
  return m;
}
function drawMarkers(){
  const geo = new THREE.CylinderGeometry(.55,.55,.12,20), mats = {};
  Object.entries(S.map).forEach(([n,t]) => {
    const m = new THREE.Mesh(geo, mats[t.type] || (mats[t.type] = new THREE.MeshLambertMaterial({ color:TYPES[t.type].c })));
    m.position.copy(tilePos(+n)); m.position.y = .26; scene.add(m);
  });
  $('legend').innerHTML = Object.values(TYPES).map(t => `<span class="dot" style="background:${hex(t.c)};border:1px solid #999"></span>${t.n}`).join(' &nbsp; ') + ' &nbsp; <span class="dot" style="background:#ffc83d"></span>จุดพัก';
}

/* ---------- Knight (ปรับแต่งได้: ผิว หมวก อาวุธ โล่ ผ้าคลุม · สีเกราะ = สีสายอาชีพ) ---------- */
const SKINS = [0xffd2a8, 0xf1c27d, 0xc68642, 0x8d5524, 0x5e3b1e];
const CAPES = [null, 0x8b1a1a, 0x1a3a8b, 0x1e7a3a, 0x6b2fa0, 0x222222];
const OPTS = { skin:{t:'ผิว', v:SKINS}, hat:{t:'หมวก', v:['หมวกเหล็ก','หมวกเขา','มงกุฎ','ผมสั้น']}, weap:{t:'อาวุธ', v:['ดาบ','ขวาน','ไม่มี']}, shield:{t:'โล่', v:['ไม่มี','โล่กลม']}, cape:{t:'ผ้าคลุม', v:CAPES} };
const defLook = () => ({ skin:0, hat:0, weap:0, shield:0, cape:0 });
function makeKnight(color, L = defLook()){
  const g = new THREE.Group(), steel = 0xcfd6e0, gold = 0xf2c230, wood = 0x6b4a2b;
  const add = (w,h,d,x,y,z,c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({ color:c })); m.position.set(x,y,z); g.add(m); };
  add(.3,.5,.3,-.18,.25,0,0x555b6e); add(.3,.5,.3,.18,.25,0,0x555b6e);   // ขา
  add(.8,.8,.4,0,.9,0,color);                                          // ลำตัว (เกราะ)
  add(.25,.7,.25,-.55,.95,0,steel); add(.25,.7,.25,.55,.95,0,steel);   // แขน
  add(.5,.5,.5,0,1.55,0,SKINS[L.skin]);                                // หัว
  if (L.hat === 0){ add(.58,.28,.58,0,1.8,0,steel); add(.1,.3,.34,0,2.05,0,color); }                         // หมวกเหล็ก + ขนนก
  if (L.hat === 1){ add(.58,.28,.58,0,1.8,0,steel); add(.1,.3,.1,-.34,2.0,0,0xf5f0dc); add(.1,.3,.1,.34,2.0,0,0xf5f0dc); } // หมวกเขา
  if (L.hat === 2){ add(.58,.14,.58,0,1.78,0,gold); [-.2,0,.2].forEach(x => add(.1,.22,.1,x,1.95,0,gold)); }  // มงกุฎ
  if (L.hat === 3){ add(.56,.16,.56,0,1.83,0,0x4a2f1a); }                                                     // ผมสั้น
  if (L.weap === 0){ add(.07,.2,.07,.55,.52,.2,wood); add(.3,.07,.1,.55,.64,.2,gold); add(.08,.9,.08,.55,1.12,.2,steel); }   // ดาบ
  if (L.weap === 1){ add(.07,1,.07,.55,.95,.2,wood); add(.4,.28,.08,.72,1.38,.2,steel); }                                   // ขวาน
  if (L.shield === 1){ add(.1,.6,.6,-.8,.95,0,color); add(.14,.22,.22,-.86,.95,0,gold); }                                   // โล่กลม
  if (L.cape) add(.74,.95,.07,0,.95,-.26,CAPES[L.cape]);                                                                     // ผ้าคลุม
  g.scale.setScalar(.8); return g;
}

/* ---------- หน้าปรับแต่ง + พรีวิว 3D ---------- */
const looks = [0,1,2,3].map(defLook);
let curI = 0, pvKnight = null;
const pv = new THREE.WebGLRenderer({ canvas:$('pv'), antialias:true }); pv.setSize(170, 210, false); pv.setClearColor(0xcfe6ff);
const pvScene = new THREE.Scene(); pvScene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.2));
const pvCam = new THREE.PerspectiveCamera(35, 170/210, .1, 50); pvCam.position.set(0, 1.3, 5); pvCam.lookAt(0, 1, 0);
const colorOf = i => $('c'+i).value;
function refreshPreview(){
  if (pvKnight) pvScene.remove(pvKnight);
  pvKnight = makeKnight(COLORS[colorOf(curI)], looks[curI]); pvKnight.scale.setScalar(1.05); pvScene.add(pvKnight);
}
function renderOpts(){
  $('custOpts').innerHTML = Object.entries(OPTS).map(([k,o]) => `<div class="mb-2"><div class="fw-semibold">${o.t}</div><div class="d-flex flex-wrap gap-1">` +
    o.v.map((v,idx) => (typeof v === 'number' || v === null)
      ? `<button class="btn sw ${looks[curI][k]===idx?'on':''}" data-k="${k}" data-v="${idx}" style="background:${v===null?'#fff':hex(v)}">${v===null?'✕':''}</button>`
      : `<button class="btn btn-outline-secondary btn-sm ${looks[curI][k]===idx?'on':''}" data-k="${k}" data-v="${idx}">${v}</button>`).join('') + '</div></div>').join('');
}
$('custOpts').onclick = e => { const b = e.target.closest('button'); if (!b) return; looks[curI][b.dataset.k] = +b.dataset.v; renderOpts(); refreshPreview(); };
$('custDone').onclick = () => $('cust').classList.add('d-none');
function openCust(i){ curI = i; $('custT').textContent = 'ปรับแต่ง: ' + ($('n'+i).value.trim() || 'อัศวิน '+(i+1)) + ' · ' + ROLES[colorOf(i)].n; renderOpts(); refreshPreview(); $('cust').classList.remove('d-none'); }

/* ---------- Popup กลาง (ใช้กับ Duel / Special NPC) ---------- */
function popup(title, body, onClick){
  return new Promise(res => {
    $('popT').textContent = title; $('popB').innerHTML = body; $('pop').classList.remove('d-none');
    $('popB').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; onClick(b, v => { $('pop').classList.add('d-none'); res(v); }); };
  });
}
function askDuel(att, def){
  const r = {};
  const row = (p, s, role) => `<div class="d-flex justify-content-between align-items-center mb-2"><span><span class="dot" style="background:${hex(COLORS[p.color])}"></span>${p.name} <small class="text-muted">(${role})</small></span><span><b id="dv${s}" class="me-2"></b><button class="btn btn-warning btn-sm" data-s="${s}">ทอย</button></span></div>`;
  return popup('⚔ Knight Duel!', row(att,'a','ผู้โจมตี') + row(def,'d','ผู้ตั้งรับ') + '<div class="small text-muted">ทั้งสองฝ่ายต้องทอยเต๋า 1 ลูก</div>', (b, done) => {
    const s = b.dataset.s; r[s] = d6(); b.disabled = true; $('dv'+s).textContent = r[s];
    if (r.a && r.d) setTimeout(() => done(r), 1400);
  });
}
function askSpecial(p){
  const others = S.players.map((q,k) => ({q,k})).filter(x => x.q !== p);
  const body = others.map(({q,k}) => `<div class="d-flex justify-content-between align-items-center mb-2"><span><span class="dot" style="background:${hex(COLORS[q.color])}"></span>${q.name} <small class="text-muted">ช่อง ${q.pos}</small></span><span><button class="btn btn-success btn-sm" data-t="${k}" data-d="1">เดินหน้า</button> <button class="btn btn-danger btn-sm" data-t="${k}" data-d="-1">ถอยหลัง</button></span></div>`).join('');
  return popup('NPC พิเศษ! เลือกอัศวินที่จะปั่นป่วน', body + '<div class="small text-muted">เลือกแล้วระบบจะทอยเต๋าพิเศษให้</div>', (b, done) => done({ t:+b.dataset.t, d:+b.dataset.d, v:d6() }));
}

/* ---------- State & Actions ---------- */
let S = null;
function place(p, n){
  const t = tilePos(n); t.x += OFF[p.i][0]; t.z += OFF[p.i][1];
  p.mesh.rotation.y = Math.atan2(t.x - p.target.x, t.z - p.target.z);
  p.target.copy(t); p.hop = 1;
}
async function walk(p, to){                       // เดินทีละช่อง (ไปหน้า/ถอยหลัง)
  const d = to >= p.pos ? 1 : -1;
  while (p.pos !== to){ p.pos += d; place(p, p.pos); hud(); await sleep(300); }
}
async function jump(p, to){ p.pos = to; place(p, to); hud(); await sleep(800); }
async function hurt(q){                           // เสีย HP 1 · หมด → กลับจุดพัก + ฟื้น HP
  q.hp--; hud(); await sleep(700);
  if (q.hp <= 0){
    const cp = Math.floor(q.pos / 10) * 10;
    say(`${q.name} พลังชีวิตหมด! กลับไปจุดพักช่อง ${cp} และฟื้น HP`);
    q.hp = q.maxHp; await jump(q, cp);
  }
}
async function duel(p){                           // ตกช่องที่มีอัศวินอื่น (ไม่ใช่ Checkpoint)
  if (p.pos % 10 === 0 || p.pos >= SIZE) return;
  const d = S.players.find(q => q !== p && q.pos === p.pos); if (!d) return;
  const r = await askDuel(p, d);
  if (r.a > r.d){ say(`${p.name} ชนะ! ${d.name} เสีย HP 1 และกระเด็นถอยหลัง 3 ช่อง`); await sleep(800); await walk(d, Math.max(1, d.pos - 3)); await hurt(d); }
  else { say(`${d.name} ป้องกันได้! ${p.name} กระเด็นถอยหลัง 1 ช่อง`); await sleep(800); await walk(p, Math.max(1, p.pos - 1)); }
}
async function dragonFire(){
  say('🐉 มังกรพ่นไฟ! อัศวินในโซนท้ายเกมเสีย HP 1 ทุกคน'); await sleep(1100);
  for (const q of S.players) if (q.pos >= ZONE) await hurt(q);
}
function won(p){
  if (p.pos < SIZE) return false;
  S.over = true; $('winMsg').textContent = `อัศวิน ${p.name} สามารถบุกไปช่วยเจ้าหญิงจากมังกรยักษ์ได้สำเร็จ!`; $('win').classList.remove('d-none'); return true;
}
function nextTurn(){
  const n = S.players.length;
  S.turn = (S.turn + 1) % n;
  while (S.players[S.turn].freeze > 0){ const q = S.players[S.turn]; q.freeze--; say(`${q.name} ติดหลุมดำ ข้ามตานี้`); S.turn = (S.turn + 1) % n; }
}
async function dispatch(a){
  const p = S.players[S.turn];
  if (a.type === 'useItem'){                      // ใช้ไอเทมก่อนทอย (ไม่เสียตา)
    const k = p.items.indexOf(a.id); if (k < 0) return;
    p.items.splice(k, 1); const e = ITEMS[a.id].e;
    if (e === 'BlockDanger') p.shield = true;
    if (e === 'BoostWarp') p.boost = 3;
    if (e === 'FullHeal') p.hp = p.maxHp;
    if (e === 'ForceSix') p.six = true;
    say(`${p.name} ใช้ ${ITEMS[a.id].n}`); hud(); return;
  }
  if (a.type !== 'roll') return;
  let extra = false;
  const v = p.six ? 6 : a.value, steps = v + (p.boost || 0);
  p.six = false; p.boost = 0;
  $('dice').textContent = steps > v ? `${v}+${steps - v}` : v; say('');
  if (S.dragon && v === 1) await dragonFire();             // มังกรตื่นแล้ว + ทอยได้ 1 → พ่นไฟ
  await walk(p, Math.min(SIZE, p.pos + steps));
  if (!won(p)){
    const t = S.map[p.pos];
    if (t){
      if (t.type === 'BlackHole'){ p.freeze = 1; say('หลุมดำ! ต้องข้ามตาถัดไป'); await sleep(900); }
      if (t.type === 'Horse'){
        const to = Math.min(SIZE - 1, t.value + (p.color === 'น้ำเงิน' ? 3 : 0));      // สายม้า +3
        say(`ม้าศึก! วิ่งไปช่อง ${to}`); await sleep(500); await jump(p, to);
      }
      if (t.type === 'NPC'){
        if (a.r < .5 || p.color === 'เขียว'){ extra = true; say('NPC ใจดี! ได้ทอยเต๋าฟรีอีก 1 ครั้ง'); await sleep(900); }   // สายเขียว: ดีเสมอ
        else { say(`NPC ผลักถอยหลัง ${v} ช่อง`); await sleep(500); await walk(p, Math.max(1, p.pos - v)); }
      }
      if (t.type === 'SpecialNPC'){
        const c = await askSpecial(p), q = S.players[c.t];
        say(`เต๋าพิเศษได้ ${c.v}! ${q.name} ${c.d > 0 ? 'เดินหน้า' : 'ถอยหลัง'} ${c.v} ช่อง`); $('dice').textContent = c.v; await sleep(900);
        await walk(q, Math.max(1, Math.min(SIZE - 1, q.pos + c.d * c.v)));               // ไม่ส่งใครเข้าเส้นชัยแทน
      }
      if (t.type === 'Danger'){
        if (p.shield){ p.shield = false; say('โล่ศักดิ์สิทธิ์กันอันตรายไว้ได้!'); await sleep(900); }
        else { say('เจออันตราย! เสียพลังชีวิต 1 ดวง'); await hurt(p); }
      }
      if (t.type === 'Treasure'){
        if (p.items.length >= MAX_ITEMS) say('พบหีบสมบัติ แต่กระเป๋าเต็ม!');
        else { const id = ITEM_IDS[Math.floor(a.k * ITEM_IDS.length)]; p.items.push(id); say(`ได้รับ ${ITEMS[id].n}!`); }
        await sleep(900);
      }
    }
    if (p.color === 'เหลือง' && v % 2 === 0 && a.q < .2 && p.hp < p.maxHp){ p.hp++; say('ดวงดี! ฟื้นพลังชีวิต 1 ดวง'); hud(); await sleep(800); }   // สายเหลือง
    await duel(p);
    if (!S.dragon && S.players.some(q => q.pos >= ZONE)){ S.dragon = true; say('🐉 มังกรตื่นแล้ว! ถ้าใครทอยได้ 1 มังกรจะพ่นไฟ'); hud(); await sleep(1500); }
  }
  if (S.over) return;
  if (!extra) nextTurn();
  hud();
}
function hud(){
  const p = S.players[S.turn];
  $('turn').innerHTML = `<span class="dot" style="background:${hex(COLORS[p.color])}"></span>ตาของ ${p.name} <small class="text-warning">${ROLES[p.color].n}</small>${S.dragon ? ' 🐉' : ''}`;
  $('inv').innerHTML = p.items.map(id => `<button class="btn btn-outline-light btn-sm" data-id="${id}" title="${ITEMS[id].d}">${ITEMS[id].n}</button>`).join('') || '<small class="text-secondary">ไม่มีไอเทม</small>';
  $('plist').innerHTML = S.players.map((q,k) => `<li class="list-group-item py-1 ${k===S.turn?'fw-bold bg-warning-subtle':''}">${q.name} · ช่อง ${q.pos} · ${'♥'.repeat(q.hp)}${q.freeze?' ⏸':''}${q.shield?' 🛡':''}${q.boost?' 🥕':''}${q.six?' ⚀6':''} · 🎒${q.items.length}</li>`).join('');
}
$('inv').onclick = async e => {
  const b = e.target.closest('button'); if (!b || !S || S.busy || S.over) return;
  S.busy = true; await dispatch({ type:'useItem', id:b.dataset.id }); S.busy = false;
};

/* ---------- Setup + ทอยลำดับเทิร์น ---------- */
$('sizes').innerHTML = [[100,'100 · เกมเร็ว'],[500,'500 · ขนาดกลาง'],[1000,'1,000 · มาราธอน']].map(([n,l],k) =>
  `<input type="radio" class="btn-check" name="sz" id="sz${n}" value="${n}" ${k===0?'checked':''}><label class="btn btn-outline-primary btn-sm" for="sz${n}">${l}</label>`).join('');
$('rows').innerHTML = [0,1,2,3].map(i => `
  <div class="input-group mb-2">
    <input class="form-control" id="n${i}" value="อัศวิน ${i+1}" maxlength="14">
    <select class="form-select" id="c${i}" style="max-width:140px">${CN.map((c,k) => `<option value="${c}" ${k===i?'selected':''}>${c} · ${ROLES[c].n}</option>`).join('')}</select>
    <button class="btn btn-outline-secondary" data-i="${i}">ปรับแต่ง</button>
  </div>`).join('');
$('rows').onclick = e => { const b = e.target.closest('button'); if (b) openCust(+b.dataset.i); };
$('roleHint').innerHTML = CN.map(c => `<span class="dot" style="background:${hex(COLORS[c])}"></span>${ROLES[c].n}: ${ROLES[c].d}`).join('<br>');

$('startBtn').onclick = () => {
  SIZE = +document.querySelector('input[name=sz]:checked').value; ZONE = SIZE * 0.8; buildBoard();
  S = { turn:0, over:false, busy:false, dragon:false, size:SIZE, seed:(Math.random()*1e9)|0,
        players:[0,1,2,3].map(i => { const color = colorOf(i), hp = color === 'แดง' ? 5 : 4;   // สายถึก HP 5
          return { i, name:$('n'+i).value.trim() || 'อัศวิน '+(i+1), color, look:{...looks[i]}, pos:0, hp, maxHp:hp, freeze:0, items:[], shield:false, boost:0, six:false }; }) };
  S.map = genMap(S.seed); drawMarkers();
  S.players.forEach(p => {
    p.mesh = makeKnight(COLORS[p.color], p.look); p.target = new THREE.Vector3(); p.hop = 0;
    const t = tilePos(1); p.target.set(t.x + OFF[p.i][0], 0, t.z + OFF[p.i][1]);
    p.mesh.position.set(p.target.x, .2, p.target.z); scene.add(p.mesh);
  });
  $('setup').classList.add('d-none'); showOrder();
};
function showOrder(){
  $('orderBox').innerHTML = S.players.map(p => `<div class="d-flex justify-content-between align-items-center mb-2"><span><span class="dot" style="background:${hex(COLORS[p.color])}"></span>${p.name}</span><span><b id="o${p.i}" class="me-2"></b><button class="btn btn-warning btn-sm" data-i="${p.i}">ทอย</button></span></div>`).join('');
  $('order').classList.remove('d-none');
  $('orderBox').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    const p = S.players.find(x => x.i == b.dataset.i), v = d6();
    p.o = v + Math.random()/10; b.disabled = true; $('o'+p.i).textContent = v;
    if (S.players.every(x => x.o)){
      S.players.sort((a,b) => b.o - a.o);                         // แต้มมาก → เล่นก่อน
      $('orderRes').textContent = 'ลำดับ: ' + S.players.map(x => x.name).join(' → ');
      await sleep(1800); $('order').classList.add('d-none');
      ['top','side','cam','legend'].forEach(id => $(id).classList.remove('d-none')); hud();
    }
  };
}
$('rollBtn').onclick = async () => {
  if (!S || S.busy || S.over) return;
  S.busy = true; $('rollBtn').disabled = true;
  await dispatch({ type:'roll', value:d6(), r:Math.random(), q:Math.random(), k:Math.random() });
  S.busy = false; $('rollBtn').disabled = false;
};
let overview = false;
$('cam').onclick = () => { overview = !overview; $('cam').textContent = overview ? 'ตามอัศวิน' : 'มองทั้งกระดาน'; };

/* ---------- Render loop ---------- */
function resize(){ renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const look = new THREE.Vector3(), want = new THREE.Vector3(0,26,20), mid = new THREE.Vector3();
cam.position.set(0,26,20); cam.lookAt(0,0,0);
(function loop(){
  requestAnimationFrame(loop);
  if (S && S.players[0].mesh) {
    S.players.forEach(p => {
      p.mesh.position.x += (p.target.x - p.mesh.position.x) * .2;
      p.mesh.position.z += (p.target.z - p.mesh.position.z) * .2;
      p.hop = Math.max(0, p.hop - .06);
      p.mesh.position.y = .2 + Math.sin(p.hop * Math.PI) * .6;
    });
    const f = S.players[S.turn].mesh.position;
    if (overview) { look.lerp(mid.set(0, 0, ov.cz), .08); want.set(0, ov.h, ov.cz + ov.h * .75); }
    else { look.lerp(f, .08); want.set(f.x, 8, f.z + 8); }
    cam.position.lerp(want, .06); cam.lookAt(look);
  }
  if (!$('cust').classList.contains('d-none') && pvKnight){ pvKnight.rotation.y += .02; pv.render(pvScene, pvCam); }
  renderer.render(scene, cam);
})();
</script>
</body>
